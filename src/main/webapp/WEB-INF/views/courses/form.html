<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form khóa học</title>

    <style>
        div {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 130px;
        }

        .error {
            color: red;
            display: block;
            margin-left: 135px;
        }

        img {
            width: 100px;
            height: 60px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<h1 th:text="${course.id == null} ? 'Thêm khóa học' : 'Cập nhật khóa học'"></h1>

<form th:action="${course.id == null} ? @{/courses/save} : @{/courses/update}"
      th:object="${course}"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}">

    <div>
        <label>Tên khóa học:</label>
        <input type="text" th:field="*{courseName}">
        <span class="error" th:errors="*{courseName}"></span>
    </div>

    <div>
        <label>Giảng viên:</label>
        <input type="text" th:field="*{instructor}">
        <span class="error" th:errors="*{instructor}"></span>
    </div>

    <div>
        <label>Thời lượng:</label>
        <input type="number" th:field="*{duration}">
        <span class="error" th:errors="*{duration}"></span>
    </div>

    <div>
        <label>Ảnh hiện tại:</label>

        <img th:if="${course.thumbnail != null}"
             th:src="@{'/uploads/' + ${course.thumbnail}}">

        <img th:if="${course.thumbnail == null}"
             th:src="@{/images/default-course.png}">
    </div>

    <div>
        <label>Upload ảnh:</label>
        <input type="file" name="imageFile" accept=".jpg,.png">
    </div>

    <button type="submit">Lưu</button>
    <a th:href="@{/courses}">Quay lại</a>

</form>

</body>
</html>
